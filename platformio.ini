; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
#default_envs = esp32-2432S028Rv2
default_envs = JC4827W543C

[env]
custom_spa_version = 0.0.6
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
extra_scripts =
	pre:scripts/gen_shell_h.py
	scripts/build_web.py
build_type = debug
build_flags =
	-Ofast
	-Wall
	-Wshadow
	-Wunused-parameter
	-'D BOARD_NAME="${this.board}"'
	-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
	'-D LV_CONF_PATH="${platformio.include_dir}/lv_conf.h"'
	#-D CONFIG_ASYNC_TCP_RUNNING_CORE=-1
	#-D CONFIG_ASYNC_TCP_USE_WDT=0
	#-D CONFIG_ASYNC_TCP_STACK_SIZE=8192
	#-D CONFIG_ASYNC_TCP_QUEUE_SIZE=64
	-D CONFIG_ESP32_WIFI_SW_COEXIST_ENABLE=1
	-D USE_NIMBLE
	-D _TASK_SLEEP_ON_IDLE_RUN
	-D _TASK_STATUS_REQUEST
	-D _TASK_SELF_DESTRUCT
	-D USE_PSYCHIC_HTTP
	; FILE_CHUNK_SIZE must be <= TCP_SND_BUF (sdkconfig: 1460 B = 1×MSS).
	; 2048 > 1460 → each chunk requires 2+ RTTs; 1024 fits in one TCP segment.
	-D FILE_CHUNK_SIZE=1024

lib_deps =
	; Pinned to the commit that merged our no-PSRAM render fixes (panic-retry +
	; BOARD_FLUSH_READY_IN_CALLBACK async-DMA flush). Was previously patched
	; post-install by scripts/patch_smartdisplay.py — no longer needed.
	https://github.com/rzeldent/esp32-smartdisplay.git#3443bf6f79876cfba8b565f7a42e9619064ea82e
	h2zero/NimBLE-Arduino@^2.2.0
	;ESP32Async/ESPAsyncWebServer@3.10.3
	; Fresh fork of t-vk/ESP32-BLE-Keyboard (original unmaintained since 2022).
	; sakul-the-one fork: NimBLE 1.4 + arduino-esp32 3.x compatible, bug fixes.
	https://github.com/sakul-the-one/sakuls-ESP32-BLE-Keyboard.git
	arkhipenko/TaskScheduler@^3.8.5
	mairas/ReactESP@^2.1.0
	; Pinned to fork with no-PSRAM WS static-RX-buffer patch (PR hoeken/PsychicHttp#247).
	; Revert to `hoeken/PsychicHttp` when upstream merges.
	https://github.com/ange007/PsychicHttp.git#e33e3c0

; Default: ESPAsyncWebServer backend (exclude PsychicHttp backend from build)
;build_src_filter = +<*> -<modules/wifi/server_psychic.cpp>
build_src_filter = +<*> -<modules/wifi/server_async.cpp>

; ── To switch to the PsychicHttp backend ─────────────────────────────────────
; 1. Add hoeken/PsychicHttp to lib_deps (or create a [env:...-psychic] env)
; 2. Replace the build_src_filter above with:
;      build_src_filter = +<*> -<modules/wifi/server_async.cpp>
; 3. Add -D USE_PSYCHIC_HTTP to build_flags
; PsychicHttp uses esp_http_server (IDF native) — more stable than async TCP.
; ─────────────────────────────────────────────────────────────────────────────

[env:esp32-2432S028Rv2]
board = esp32-2432S028Rv2
; Plain ESP32 (no PSRAM): tight DRAM + heap.
; NimBLE enabled. Two changes make it fit on no-PSRAM:
;   1. LVGL9 shadow cache disabled (lv_conf.h): frees 64 KB static .bss → links.
;   2. BLE deinit on service-mode enter (server_base.cpp, now all boards): frees
;      NimBLE's ~24 KB resident controller while the web UI is open, so the
;      service-mode burst no longer OOMs. BLE typing works in normal mode;
;      reinits on service-mode exit.
; Draw buffer 1/10 screen: single-buffer, MALLOC_CAP_INTERNAL heap.
build_flags = ${env.build_flags}
	; Whole-flag single-quote (matches board-json style) so the parens survive
	; Linux/sh during CI builds — value-only quoting breaks with "Syntax error".
	'-D LVGL_BUFFER_PIXELS=(DISPLAY_WIDTH*DISPLAY_HEIGHT/10)'
	-D BOARD_TF_SKIP_INIT
	-D BOARD_FLUSH_READY_IN_CALLBACK
	-D PSYCHIC_WS_MAX_FRAME_SIZE=2048
	-D PSYCHIC_WS_RX_STATIC_BUFFER

[env:JC4827W543C]
board = JC4827W543C
; Flash: 4 MB — OTA not supported (insufficient space for two app slots)
; microSD pins now come from the board json (merged upstream; submodule pinned
; to that commit). Only USB_MODE stays local: ARDUINO_USB_MODE 1→0 switches to
; TinyUSB (OTG) so the USB-HID keyboard works on the S3 — upstream defaults to
; hardware CDC, which suits other users.
build_unflags = -D ARDUINO_USB_MODE=1
build_flags = ${env.build_flags}
	-D ARDUINO_USB_MODE=0

; ── To enable OTA on boards with 16 MB flash ──────────────────────────────
; 1. Use partitions_ota.csv  (two 2 MB app slots + 12 MB LittleFS)
; 2. Add: board_build.flash_size = 16MB
;         board_upload.flash_size = 16MB
;         build_flags = ${env.build_flags} -D OTA_ENABLED
; ──────────────────────────────────────────────────────────────────────────

[env:JC4827W543C-screenshot]
board = JC4827W543C
build_unflags = -D ARDUINO_USB_MODE=1
build_flags = ${env.build_flags}
    -D ARDUINO_USB_MODE=0
    -D ENABLE_SCREENSHOT_ENDPOINT

; Debug: force BLE-only HID on the S3 (USB-HID disabled) to reproduce the
; Bluetooth keyboard hang and observe it on the serial monitor.
; DISABLE_USB_HID compiles out the USB stack entirely, so ARDUINO_USB_MODE is
; irrelevant — leave the board default (hardware CDC) for serial logging.
[env:JC4827W543C-ble]
board = JC4827W543C
build_flags = ${env.build_flags}
    -D DISABLE_USB_HID