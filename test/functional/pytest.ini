[pytest]
# Pacing: add small sleep between tests to reduce TCP pool pressure on the
# embedded httpd (max_open_sockets=3, MSL=60s → burst tests can exhaust PCBs).
# For full-throughput stress testing, use scripts/test_webui.py instead.
addopts = -ra --tb=short -p no:cacheprovider
timeout = 120
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
